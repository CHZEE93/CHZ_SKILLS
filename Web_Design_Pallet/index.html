<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Pallet · 장비 수리 작업대</title><link rel="stylesheet" href="preview.css"><script src="preview.js" defer></script></head>
<body><header><strong><i aria-hidden="true">P</i> Pallet</strong><span>서비스 운영실</span><small>디자인 스킬 미리보기</small></header>
<main><p class="overline">SERVICE DESK　/　WORKSPACE 01</p><h1>장비 수리 작업대</h1><p class="intro">접수된 장비를 선택해 점검 내용을 기록하고 처리 상태를 갱신하세요.</p>
<div class="desk"><section id="queue"><h2>접수 목록</h2><label for="search">장비명 또는 접수번호</label><input id="search" type="search" placeholder="예: 모니터, R-1042"><label for="filter">처리 상태</label><select id="filter"><option>전체</option><option>대기</option><option>점검 중</option><option>완료</option></select><div id="rows"></div></section>
<section id="work"><button id="back" type="button">← 접수 목록</button><p class="overline" id="ref"></p><h2 id="name" tabindex="-1"></h2><p id="symptom"></p><form><label for="state">처리 상태</label><select id="state"><option>대기</option><option>점검 중</option><option>완료</option></select><div class="line"><label for="note">점검 기록</label><button id="template" type="button">점검 서식 삽입</button></div><textarea id="note" rows="7" placeholder="점검 결과와 다음 조치를 작성하세요." required></textarea><p class="hint">저장 전 작성 내용은 다른 접수 건을 확인해도 유지됩니다.</p><button class="primary" type="submit">점검 기록 저장</button></form></section>
<aside id="audit"><p class="overline">ACTIVITY</p><h2>처리 이력</h2><ol id="history"></ol></aside></div><p id="feedback" role="status"></p><footer>Web_Design_Pallet <span>가상 데이터 · 새로고침 시 초기화</span></footer></main></body></html>
