<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>팔레트 · 외래 진료 워크스페이스</title><link rel="stylesheet" href="preview.css"><script src="preview.js" defer></script></head><body>
<header><div class="clinic"><b>P</b> 다온의원</div><strong id="location">차트</strong><input id="search" type="search" aria-label="환자 검색" placeholder="⌕　환자명 · 차트번호 검색"><button id="register">＋ 신규 접수</button><small>교육용 데모</small><i>서</i></header>
<div class="shell"><nav aria-label="업무 메뉴"><div class="caption">워크스페이스</div><div id="nav"></div><footer>PALLET<br>DESIGN STUDY</footer></nav>
<aside id="queue"><h2>환자리스트</h2><div id="filters" class="tabs"></div><div id="patients"></div></aside>
<main><div id="identity"></div><div id="chart"><section id="visits"><h2>내원이력</h2><div id="visitsList"></div></section>
<section id="center"><div class="date">오늘 진료 <strong>2026.11.01</strong>　·　서하늘 원장</div><div class="box"><h2>진료기록</h2><div class="notegrid"><label class="sr" for="note">현재 진료기록</label><textarea id="note"></textarea><div class="media"><strong>이미지</strong><p id="mediaInfo">첨부된 이미지 없음</p><label class="upload">사진 첨부<input type="file" id="photo" accept="image/*"></label><button id="look" hidden>크게 보기</button></div></div></div>
<div class="box orders"><h2>진단 및 처방</h2><button id="orderSearch" class="searchLike">⌕　오더 검색</button><div id="ordered"></div></div><div class="action"><span id="room"></span><button id="save">임시 저장</button><button class="primary" id="send">수납 대기 보내기</button></div></section>
<section id="sets"><h2>오더세트</h2><input id="setQuery" aria-label="오더세트 검색" placeholder="세트 검색"><div id="setList"></div></section>
<aside id="memos"><h2>환자기록</h2><div id="memoList"></div><form id="memoForm"><label for="memo">직원 공유 메모</label><textarea id="memo" rows="3" required></textarea><button>메모 등록</button></form></aside></div><div id="other" hidden></div></main></div>
<div role="status" id="toast"></div><dialog id="modal"><div class="dialogTop"><h2 id="modalTitle"></h2><button id="close" aria-label="닫기">×</button></div><div id="modalBody"></div></dialog></body></html>
